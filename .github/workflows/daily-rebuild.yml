# Rebuilds the live site on Vercel once a day so the news ticker and Latest news page pick up
# new headlines. It calls a Vercel deploy hook for the main branch; the hook's URL is
# stored in the repository secret VERCEL_DEPLOY_HOOK_URL (see README, "Daily rebuild").
name: Daily rebuild

on:
  schedule:
    # GitHub schedules run in UTC, so there is one line for each half of the year. The
    # "Check the time" step skips whichever one isn't 6:45 am in Canberra today, so the new
    # news is live by 7 am.
    - cron: "45 19 * * *" # 6:45 am Canberra during daylight saving (UTC+11)
    - cron: "45 20 * * *" # 6:45 am Canberra outside daylight saving (UTC+10)
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check the time
        id: time
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Australia/Canberra date +%z)
          if [ -z "$SCHEDULE" ] \
            || { [ "$offset" = "+1100" ] && [ "$SCHEDULE" = "45 19 * * *" ]; } \
            || { [ "$offset" = "+1000" ] && [ "$SCHEDULE" = "45 20 * * *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: this schedule isn't 6:45 am in Canberra today (UTC$offset)."
          fi

      - name: Trigger Vercel deploy hook
        if: steps.time.outputs.run == 'true'
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::The VERCEL_DEPLOY_HOOK_URL secret is not set. See README, 'Daily rebuild'."
            exit 1
          fi
          curl -fsS -X POST "$HOOK_URL"
